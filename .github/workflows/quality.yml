# tp3
name: quality
on:
  pull_request:
    # opened = création, synchronize = nouveau push, reopened = réouverture
    types: [opened, synchronize, reopened]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install and format ruff
      # ruff pour rester Rust fanbooy
        run: |
          pip install ruff
          ruff format --check tests/ 
      - name: check
        run: cargo check
      - name: clippy
        run: cargo clippy
      - name: format
        run: cargo fmt --check