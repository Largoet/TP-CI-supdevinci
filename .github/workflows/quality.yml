# tp3
name: quality
on: [pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install ruff
        run: |
          pip install ruff
          ruff format --check tests/ 
      - name: check
        run: cargo check
      - name: clippy
        run: cargo clippy
      - name: format
        run: cargo fmt --check