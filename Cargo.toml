[workspace]
resolver = "2"
members = ["simeis-data", "simeis-server", "sdk/rust" ] #, "example/rust"]
exclude = ["example/rust"]

[workspace.dependencies]
log = "0.4.29"
env_logger = "0.11.10"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
base64 = "0.22.1"
mea = "0.6.3"

[profile.release]
opt-level = 3
strip = "symbols"
overflow-checks = false
lto = "thin"
panic = "abort"
incremental = false
codegen-units = 1
